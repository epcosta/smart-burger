services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-burger-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: smartburger

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartburger"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back-end
    env_file:
      - ./back-end/.env

    container_name: smart-burger-backend

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/smartburger"

    volumes:
      - ./back-end:/app
      - backend_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ./front-end

    container_name: smart-burger-frontend

    ports:
      - "5173:5173"

    environment:
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - ./front-end:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
